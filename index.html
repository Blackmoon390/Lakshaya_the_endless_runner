<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odukali Lakshaya</title>
<style>
  :root {
    --yellow: #ffd60a;
    --yellow-deep: #ffb800;
    --ink: #2b1d00;
    --white: #fffdf2;
    --pink: #ff4d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: var(--yellow);
    background-image: radial-gradient(var(--yellow-deep) 22%, transparent 24%);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Arial Black", "Trebuchet MS", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    gap: 1rem;
    padding: 1rem;
  }
  .center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.6rem; }
  h1 {
    font-size: clamp(2.6rem, 8vw, 6.5rem);
    line-height: 0.95;
    color: var(--white);
    -webkit-text-stroke: 4px var(--ink);
    paint-order: stroke fill;
    text-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-4deg);
    animation: titleWobble 2.4s ease-in-out infinite;
  }
  .tag { font-size: clamp(1rem, 2.4vw, 1.5rem); background: var(--ink); color: var(--yellow); padding: .35rem 1rem; border-radius: 8px; transform: rotate(2deg); }
  #go {
    font: inherit;
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    padding: .8rem 2.6rem;
    background: var(--pink);
    color: var(--white);
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: 0 8px 0 var(--ink);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #go:hover { background: #ff6b86; }
  #go:active { transform: translateY(8px); box-shadow: 0 0 0 var(--ink); animation: none; }
  #go:focus-visible, #mute:focus-visible { outline: 4px solid var(--white); outline-offset: 4px; }

  .head {
    width: clamp(110px, 24vw, 340px);
    cursor: pointer;
    filter: drop-shadow(8px 10px 0 rgba(43,29,0,.85));
    transform-origin: 50% 90%;
    animation: bob 1.6s ease-in-out infinite;
  }
  #h2 { animation-delay: -.8s; --tilt: 6deg; }
  #h1 { --tilt: -6deg; }
  .head.hit { animation: squish .45s ease-out; }

  .pop {
    position: fixed;
    pointer-events: none;
    font-size: 2rem;
    color: var(--white);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    animation: floatUp 1s ease-out forwards;
    z-index: 5;
  }
  #score {
    position: fixed; left: 1rem; bottom: 1rem;
    background: var(--ink); color: var(--yellow);
    padding: .5rem 1rem; border-radius: 12px; font-size: 1.1rem;
  }
  #gate { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(255,214,10,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer; }
  #gate[hidden] { display: none; }
  #gate span { font-size: clamp(1.6rem, 5vw, 3rem); background: var(--ink); color: var(--yellow); padding: .8rem 1.8rem; border-radius: 16px; animation: pulse 1.2s ease-in-out infinite; }
  #hint { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font-size: .95rem; pointer-events: none; }
  #mute {
    position: fixed; top: 1rem; right: 1rem;
    font: inherit; font-size: .95rem;
    background: var(--white); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: .35rem 1rem; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
  }

  @keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--tilt, -6deg)); } 50% { transform: translateY(-22px) rotate(calc(var(--tilt, -6deg) * -1)); } }
  @keyframes squish { 0% { transform: scale(1,1); } 25% { transform: scale(1.35,.65); } 55% { transform: scale(.8,1.25); } 100% { transform: scale(1,1); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes titleWobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(-1deg) scale(1.03); } }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(.8); } to { opacity: 0; transform: translateY(-90px) scale(1.4); } }

  @media (max-width: 640px) {
    main { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; align-content: center; }
    .center { grid-column: 1 / 3; grid-row: 1; }
    #h1 { grid-row: 2; grid-column: 1; } #h2 { grid-row: 2; grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<button id="mute" type="button" aria-label="Toggle music">Music: on</button>

<main>
  <img id="h1" class="head" src="head1.png" alt="Smiling head" draggable="false">
  <div class="center">
    <h1>Odukali<br>Lakshaya!</h1>
    <div class="tag">Run. Jump. Giggle.</div>
    <button id="go" type="button">Let's play!</button>
  </div>
  <img id="h2" class="head" src="head2.png" alt="Laughing head" draggable="false">
</main>

<div id="score">Giggles: 0</div>
<p id="hint"></p>
<div id="gate"><span>Tap anywhere to start</span></div>
<audio id="bgm" src="bg1.mp3" loop preload="auto"></audio>

<script>
  const bgm = document.getElementById('bgm');
  const muteBtn = document.getElementById('mute');
  const hint = document.getElementById('hint');
  let wantMusic = true;
  bgm.volume = 0.6;

  const unlockEvents = ['pointerdown', 'pointerup', 'mousedown', 'click', 'touchend', 'keydown'];
  const gate = document.getElementById('gate');

  function startMusic() {
    if (!wantMusic) return;
    bgm.play().then(() => {
      unlockEvents.forEach(e => document.removeEventListener(e, startMusic));
    }).catch(() => {});
  }
  // Browsers only allow sound after a tap/click/key press, so retry on the first one.
  unlockEvents.forEach(e => document.addEventListener(e, startMusic));
  bgm.addEventListener('canplaythrough', startMusic, { once: true });
  startMusic();

  // Yellow cover screen: first tap or key press starts the music and reveals the page
  function openGate() { gate.hidden = true; startMusic(); }
  gate.addEventListener('click', openGate);
  document.addEventListener('keydown', () => { if (!gate.hidden) openGate(); });

  muteBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    wantMusic = !wantMusic;
    wantMusic ? bgm.play().catch(() => {}) : bgm.pause();
    muteBtn.textContent = 'Music: ' + (wantMusic ? 'on' : 'off');
  });

  // Click a head: it squishes and giggles
  const words = ['HA!', 'HEHE!', 'HAHA!', 'LOL!', 'HOHO!', 'TEE-HEE!'];
  let giggles = 0;
  document.querySelectorAll('.head').forEach(head => {
    head.addEventListener('click', (e) => {
      head.classList.remove('hit'); void head.offsetWidth; head.classList.add('hit');
      giggles++;
      document.getElementById('score').textContent = 'Giggles: ' + giggles;
      const p = document.createElement('div');
      p.className = 'pop';
      p.textContent = words[Math.floor(Math.random() * words.length)];
      p.style.left = (e.clientX - 40) + 'px';
      p.style.top = (e.clientY - 30) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    });
  });

  document.getElementById('go').addEventListener('click', () => {
    try { localStorage.setItem('bgTime', bgm.currentTime); localStorage.setItem('bgOn', wantMusic ? '1' : '0'); } catch (e) {}
    window.location.href = 'main_game.html';
  });
</script>
</body>
</html>

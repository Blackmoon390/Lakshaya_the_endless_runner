<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Runner</title>
<style>
:root{box-sizing:border-box;--bg:#8fd0ff}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;gap:8px;z-index:5}
.ui button{font:600 15px system-ui,sans-serif;color:#223;background:rgba(255,255,255,.92);border:2px solid #223;border-radius:10px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
.ui button:active{transform:scale(.96)}
#loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#8fd0ff;font:700 22px system-ui,sans-serif;color:#223;transition:opacity .25s}
#loader.done{opacity:0;pointer-events:none}
#bar{width:min(260px,70vw);height:14px;border:3px solid #223;border-radius:10px;background:#fff;overflow:hidden}
#fill{height:100%;width:0;background:#ffb800;transition:width .15s}
#lmsg{font-size:15px;font-weight:600}
#retry{display:none;font:600 15px system-ui,sans-serif;padding:8px 14px;border:2px solid #223;border-radius:10px;background:#fff;cursor:pointer}
</style></head><body>
<div id="loader"><div>Loading…</div><div id="bar"><div id="fill"></div></div><div id="lmsg">0%</div><button id="retry" type="button">Retry</button></div>
<canvas id="c"></canvas>
<div class="ui">
  <button id="btnMenu" type="button">☰ Menu</button>
  <button id="btnRestart" type="button">↻ Restart</button>
</div>
<script>
const MENU_URL="index.html"; // page the Menu button opens
const BODY="animated_frame/run_strip_body.webp", HEAD="animated_frame/head.webp", HEAD2="animated_frame/head2_resized.webp";
const FW=290, FH=554, HEAD_W=150, HEAD_H=190;
const HEAD_TOP=[24,24,20,21,22,21,25];
const HEAD_LEFT=[127,127,128.5,127.5,126.5,126.5,128.5];
// Heads are placed by their CHIN so they sit on the neck (aspect ratio preserved).
const HEADS_W=1390, HEADS_H=1132;           // source image size (both heads)
const HEAD1_CHIN=[686,1003], HEAD2_CHIN=[685,1002]; // chin point inside each image
const HEAD1_SCALE=0.15, HEAD2_SCALE=0.15;   // SIZE: body-frame px per source px (bigger = bigger head)
const NECK_TOP=[184,184,180,181,182,181,185]; // neck top y per run frame (frame px)
const NECK_X=204;                           // neck centre x (frame px)
const CHIN_DROP=45;                         // how far the chin sits below neck top (bigger = head lower)
const HEAD1_DX=0, HEAD1_DY=0, HEAD2_DX=0, HEAD2_DY=0; // fine nudges (frame px)
const S=0.3, SW=FW*S, SH=FH*S;

// ===== SPEED =====
const START_SPEED=230;   // running speed at start (was 320)
const MAX_SPEED=400;     // top speed (was 720)
const SPEED_RAMP=250;    // distance (px) needed for +1 speed -> bigger = speeds up more slowly
// ===== JUMP & OBSTACLES (adjust automatically to running speed) =====
const JUMP_H=150;        // jump height (px)
const JUMP_DIST=250;     // horizontal distance covered in one jump (px) -> bigger = longer jump
const JUMP_MIN_T=0.6;    // shortest jump time (s)
const MIN_GAP=400;       // minimum distance between obstacles (px)
const GAP_RANGE=300;     // extra random distance between obstacles (px)
function jumpParams(speed){ const T=Math.max(JUMP_MIN_T,JUMP_DIST/speed); return {T, v:-4*JUMP_H/T, g:8*JUMP_H/(T*T)}; }
// ===== NPC (runs in front of the player; the player chases it) =====
const NPC_BODY="animated_frame/npc_body_strip.webp"; // 7-frame headless body strip (already prepared)
const NPC_HEAD="animated_frame/head_npc.webp";       // <<< NPC HEAD FILE (inside animated_frame folder)
const NPC_X=520;                 // world x of the NPC's neck (player neck is ~151) -> bigger = further ahead
const NFW=340, NFH=410;          // NPC strip: frame size (px)
const NNECK_X=230;               // neck centre x inside each frame
const NNECK_TOP=[7,7,6,8,6,7,10];// neck top y per frame
const NFOOT=398;                 // y of the feet/ground line inside a frame
const NS=0.28;                   // NPC body scale (same idea as S)
const NPC_HEAD_H=170;            // head height in frame px (bigger = bigger head)
const NPC_CHIN=[0.5,0.95];       // chin point inside head image (0..1 of width/height)
const NPC_CHIN_DROP=40;          // how far chin sits below neck top (bigger = head lower)
const NPC_HEAD_DX=10, NPC_HEAD_DY=0; // fine nudges (frame px)
// ===== NPC 2 (starts at the player, overtakes, squats between player & NPC 1 and drops an obstacle, then overtakes NPC 1 and leaves the screen) =====
const N2_BODY="animated_frame/npc_2_body_strip.webp";   // 7-frame headless run strip
const N2_HEAD="animated_frame/head_npc2.webp";         // NPC 2 head
const N2_SIT ="animated_frame/npc2_sit.webp";          // squatting pose (headless)
const POOP_IMGS=["animated_frame/obstacle1.webp","animated_frame/obstacle2.webp"]; // one is picked at random
const N2_FW=1916/7, N2_SY=220, N2_SH=410;             // strip: frame width, crop top, crop height (px)
const N2_NECK_X=[178,184,193.5,204,206,203,193];      // neck centre x per frame
const N2_NECK_TOP=[13,15,16,15,16,16,16];             // neck top y per frame (after crop)
const N2_FOOT=400;                                    // ground line inside the cropped frame
const N2_HEAD_H=170, N2_CHIN=[0.5,0.97], N2_CHIN_DROP=40, N2_HEAD_DX=0, N2_HEAD_DY=0; // head size / placement
const N2_START_X=70;     // where NPC2 starts (just behind the player)
const N2_REL=[150,240];  // overtaking speed (px/s): random per visit [min,max]
// Each visit picks a random PATTERN (never the same one twice in a row). w = how common, stops = where it squats (neck x) and whether it drops an obstacle.
// (player neck ~151, NPC1 neck ~520, screen is >= 800 wide)
const N2_PATTERNS=[   // every pattern ALWAYS drops an obstacle on the ground in front of the player or in front of NPC1
  {name:'classic',w:40,stops:[{x:470,drop:true}]},                        // squat between player and NPC1 -> obstacle in front of the player
  {name:'late',   w:35,stops:[{x:650,drop:true}]},                        // pass NPC1 first, then drop -> obstacle in front of NPC1
  {name:'double', w:25,stops:[{x:420,drop:true},{x:650,drop:true}]}       // one in front of the player, one in front of NPC1
];
function pickPattern(last){
  const c=N2_PATTERNS.filter(p=>p.name!==last); let r=Math.random()*c.reduce((a,p)=>a+p.w,0);
  for(const p of c){ if((r-=p.w)<0) return p; } return c[0];
}
const N2_SIT_T=0.55;     // seconds spent squatting
const N2_FIRST=[8,16];   // first appearance: random wait in seconds [min,max]
const N2_GAP=[20,45];    // later appearances: random wait between visits [min,max] -> bigger = rarer
const n2wait=r=>r[0]+Math.random()*(r[1]-r[0]);
const SIT_CROP=[390,155,670,995], SIT_NECK=[490,8], SIT_S=0.09; // sit image crop, neck point, SIZE
const SIT_HEAD_DX=0, SIT_HEAD_DY=0;                   // nudge head on the squat pose
const POOP_CROP=[244,64,336,333], POOP_W=38, POOP_H=38, POOP_BUTT_X=65; // obstacle crop + size
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=800,H=400,GROUND=330,K=1,OY=0,DPR=1,VT=0,VB=400;const PX=90;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const cw=innerWidth,ch=innerHeight;
  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);
  K=Math.min(cw/800,ch/400);          // fit at least 800x400 world units
  W=cw/K;
  H=Math.min(ch/K,460);               // limit height on tall (portrait) screens
  OY=(ch/K-H)/2;                      // centre play area vertically
  GROUND=H-70; VT=-OY; VB=H+OY;
}
// ---- Asset loading: images are downscaled files; (ow,oh) = ORIGINAL size so all the coordinates above still work ----
const ASSETS=[]; let loadedN=0;
function ld(url,ow,oh){const i=new Image(); i.decoding='async'; i.ow=ow; i.oh=oh; i.url=url; ASSETS.push(i); return i;}
const body=ld(BODY,2030,554), head=ld(HEAD,1390,1132), head2=ld(HEAD2,1390,1132), nbody=ld(NPC_BODY,2380,410), nhead=ld(NPC_HEAD,1231,1277); let nheadOK=false;
const n2body=ld(N2_BODY,1916,821), n2head=ld(N2_HEAD,1176,1338), n2sit=ld(N2_SIT,670,995), poopImgs=POOP_IMGS.map(u=>ld(u,336,333));
// draw a source rectangle given in ORIGINAL pixel coordinates
function dr(im,sx,sy,sw,sh,dx,dy,dw,dh){const kx=im.naturalWidth/im.ow, ky=im.naturalHeight/im.oh; ctx.drawImage(im,Math.round(sx*kx),Math.round(sy*ky),Math.max(1,Math.round(sw*kx)),Math.max(1,Math.round(sh*ky)),dx,dy,dw,dh);}
function loadAll(){
  const fill=document.getElementById('fill'), msg=document.getElementById('lmsg');
  loadedN=0; fill.style.width='0'; msg.textContent='0%';
  const tick=()=>{loadedN++; const p=Math.round(loadedN/ASSETS.length*100); fill.style.width=p+'%'; msg.textContent=p+'%';};
  return Promise.all(ASSETS.map(i=>new Promise((res,rej)=>{
    i.onload=()=>{(i.decode?i.decode():Promise.resolve()).catch(()=>{}).then(()=>{tick(); res();});};
    i.onerror=()=>rej(new Error('Failed to load '+i.url));
    i.src=i.url;
  })));
}

let ready=false;
let best=0; try{best=+localStorage.getItem('rb')||0}catch(e){}
let st, last=0;

function reset(){
  st={npc:{y:0,vy:0,g:2400,air:false,frame:0},npc2:{state:'idle',timer:n2wait(N2_FIRST),x:N2_START_X,y:0,vy:0,g:2400,air:false,frame:0,sitT:0,stops:[],si:0,rel:170,last:''},g:2400,y:0,vy:0,air:false,speed:START_SPEED,dist:0,t:0,frame:0,obs:[],next:1.0,clouds:[],hearts:[],heartT:0,over:false,started:false,off:0};
  for(let i=0;i<4;i++) st.clouds.push({x:Math.random()*W,y:30+Math.random()*90,s:.6+Math.random()*.6});
}
function jump(){
  if(!ready) return;
  if(st.over){ if(st.t>.4) {reset(); st.started=true;} return; }
  st.started=true;
  if(!st.air){ const j=jumpParams(st.speed); st.vy=j.v; st.g=j.g; st.air=true; }
}
addEventListener('keydown',e=>{ if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault(); if(!e.repeat) jump();} });
document.getElementById('btnRestart').addEventListener('click',e=>{if(!ready) return; reset(); st.started=true; e.currentTarget.blur();});
document.getElementById('btnMenu').addEventListener('click',()=>{location.href=MENU_URL;});
cv.addEventListener('pointerdown',e=>{e.preventDefault(); jump();});

function spawn(){
  const k=Math.random();
  let o;
  if(k<.4) o={w:34,h:44,type:'crate'};
  else if(k<.7) o={w:30,h:62,type:'cone'};
  else if(k<.9) o={w:56,h:44,type:'crate2'};
  else o={w:90,h:44,type:'crate3'};
  o.x=W+20; st.obs.push(o);
  st.next=(MIN_GAP+Math.random()*GAP_RANGE)/st.speed;   // spacing in px, so it scales with speed
}

function update(dt){
  st.t+=dt;
  updateHearts(dt);   // hearts are always on, even on the start / game over screen
  if(st.over||!st.started) return;
  st.speed=Math.min(MAX_SPEED,START_SPEED+st.dist/SPEED_RAMP);
  st.dist+=st.speed*dt;
  st.off=(st.off+st.speed*dt)%40;
  if(st.air){ st.vy+=st.g*dt; st.y+=st.vy*dt; if(st.y>=0){st.y=0;st.vy=0;st.air=false;} }
  st.frame=(st.frame+dt*st.speed/38)%7;
  st.next-=dt; if(st.next<=0) spawn();
  for(const o of st.obs) o.x-=st.speed*dt;
  st.obs=st.obs.filter(o=>o.x+o.w>-10);
  st.clouds.forEach(c=>{c.x-=st.speed*dt*.1*c.s; if(c.x<-80){c.x=W+40;c.y=30+Math.random()*90;}});
  // NPC: runs ahead, jumps obstacles before the player gets there
  const n=st.npc;
  n.frame=(n.frame+dt*st.speed/38)%7;
  if(n.air){ n.vy+=n.g*dt; n.y+=n.vy*dt; if(n.y>=0){n.y=0;n.vy=0;n.air=false;} }
  else{
    const j=jumpParams(st.speed);
    for(const o of st.obs){
      const d=(o.x+o.w/2)-NPC_X;               // distance from NPC to obstacle centre
      if(d>0 && d<=st.speed*j.T/2+4){ n.vy=j.v; n.g=j.g; n.air=true; break; }
    }
  }
  updateNpc2(dt);
  // hitbox (forgiving)
  const hx=PX+SW*.25, hw=SW*.35, hy=GROUND+st.y-SH+18, hh=SH-22;
  for(const o of st.obs){
    const oy=GROUND-o.h;
    if(hx<o.x+o.w-4 && hx+hw>o.x+4 && hy<GROUND-4 && hy+hh>oy+4 && (GROUND+st.y)>oy+8){
      st.over=true; st.t=0; const sc=Math.floor(st.dist/10);
      if(sc>best){best=sc; try{localStorage.setItem('rb',best)}catch(e){}}
    }
  }
}

function updateNpc2(dt){
  const n=st.npc2, sp=st.speed;
  if(n.state==='idle'){
    n.timer-=dt;
    if(n.timer<=0){
      const p=pickPattern(n.last); n.last=p.name;
      n.stops=p.stops.map(q=>({x:q.x+(Math.random()*40-20),drop:q.drop}));   // small random shift of each stop
      n.si=0; n.rel=N2_REL[0]+Math.random()*(N2_REL[1]-N2_REL[0]);
      n.state='run'; n.x=N2_START_X; n.y=0; n.vy=0; n.air=false; n.frame=0;
    }
    return;
  }
  if(n.state==='sit'){                       // squatting: stays on the ground, so it scrolls with the world
    n.x-=sp*dt; n.sitT+=dt;
    if(n.sitT>=N2_SIT_T){ n.state='run'; n.si++; }
    return;
  }
  let vx=n.rel;
  n.frame=(n.frame+dt*(sp+vx*.5)/38)%7;
  const stop=n.stops[n.si];
  if(stop && n.x>=stop.x && !n.air){
    const clear=!st.obs.some(o=>o.x+o.w>n.x-150 && o.x<n.x+240);
    if(clear){ startSit(n,stop); return; }
    vx=0;                                    // hold position (running in place) until the path is clear
  }
  n.x+=vx*dt;
  if(n.air){ n.vy+=n.g*dt; n.y+=n.vy*dt; if(n.y>=0){n.y=0;n.vy=0;n.air=false;} }
  else{
    const j=jumpParams(sp), closing=sp+vx;
    for(const o of st.obs){
      const d=(o.x+o.w/2)-n.x;
      if(d>0 && d<=closing*j.T/2+4){ n.vy=j.v; n.g=j.g; n.air=true; break; }
    }
  }
  if(n.si>=n.stops.length && n.x>W+120){ n.state='idle'; n.timer=n2wait(N2_GAP); }   // left the screen -> next visit later
}
function startSit(n,stop){
  n.state='sit'; n.sitT=0; n.y=0; n.vy=0; n.air=false;
  if(!stop.drop) return;
  const dx=n.x-SIT_NECK[0]*SIT_S;            // left edge of the squat image
  st.obs.push({w:POOP_W,h:POOP_H,type:'poop',img:Math.floor(Math.random()*POOP_IMGS.length),x:dx+POOP_BUTT_X*SIT_S-POOP_W/2});
}
// ===== LOVE HEARTS near the player's head while NPC 2 is on screen =====
const HEART_RATE=4;      // hearts per second
const HEART_DX=0, HEART_DY=0; // nudge spawn point near the head (px)
function updateHearts(dt){
  {
    st.heartT-=dt;
    while(st.heartT<=0){
      st.heartT+=1/HEART_RATE;
      const hx=PX+NECK_X*S+HEART_DX, hy=GROUND+st.y-SH+4+8+HEART_DY;   // just above the player's head
      st.hearts.push({x:hx+(Math.random()*30-15),y:hy,vx:Math.random()*16-8,vy:-(30+Math.random()*25),s:5+Math.random()*6,life:0,max:1.1+Math.random()*.6,ph:Math.random()*6});
    }
  }
  for(const h of st.hearts){ h.life+=dt; h.y+=h.vy*dt; h.x+=(h.vx+Math.sin(h.life*5+h.ph)*12)*dt; }
  st.hearts=st.hearts.filter(h=>h.life<h.max);
}
function drawHearts(){
  for(const h of st.hearts){
    const k=h.life/h.max, s=h.s*(0.6+Math.min(1,k*4)*.4), x=h.x, y=h.y;
    ctx.globalAlpha=1-k*k;
    ctx.fillStyle='#ff3b6b'; ctx.strokeStyle='#c2184a'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,y+s*.35);
    ctx.bezierCurveTo(x-s*.9,y-s*.3,x-s*.45,y-s*.95,x,y-s*.45);
    ctx.bezierCurveTo(x+s*.45,y-s*.95,x+s*.9,y-s*.3,x,y+s*.35);
    ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawNpc2(){
  const n=st.npc2; if(n.state==='idle') return;
  let ax,ay,sx,sy,hh=N2_HEAD_H*NS;
  if(n.state==='sit'){
    if(!n2sit.naturalWidth) return;
    const dx=n.x-SIT_NECK[0]*SIT_S, dy=GROUND-989*SIT_S;
    ctx.drawImage(n2sit,dx,dy,SIT_CROP[2]*SIT_S,SIT_CROP[3]*SIT_S);
    ax=n.x+SIT_HEAD_DX; ay=dy+SIT_NECK[1]*SIT_S+N2_CHIN_DROP*NS+SIT_HEAD_DY;
  } else {
    if(!n2body.naturalWidth) return;
    const f=n.air?2:Math.floor(n.frame), fw=Math.round(N2_FW);
    const nx=n.x-N2_NECK_X[f]*NS, ny=GROUND+n.y-N2_FOOT*NS;
    dr(n2body,Math.round(f*N2_FW),N2_SY,fw,N2_SH,nx,ny,fw*NS,N2_SH*NS);
    ax=n.x+N2_HEAD_DX*NS; ay=ny+(N2_NECK_TOP[f]+N2_CHIN_DROP+N2_HEAD_DY)*NS;
  }
  if(n2head.naturalWidth){
    const hw=hh*n2head.naturalWidth/n2head.naturalHeight;
    ctx.drawImage(n2head,ax-hw*N2_CHIN[0],ay-hh*N2_CHIN[1],hw,hh);
  }
}

function drawObs(o){
  const y=GROUND-o.h;
  if(o.type==='poop'){
    const im=poopImgs[o.img];
    if(im&&im.naturalWidth) ctx.drawImage(im,o.x,y,o.w,o.h);
    else { ctx.fillStyle='#7a4a22'; ctx.beginPath(); ctx.arc(o.x+o.w/2,GROUND-o.h/2,o.h/2,0,7); ctx.fill(); }
    return;
  }
  if(o.type==='cone'){
    ctx.fillStyle='#ff7a1a'; ctx.beginPath(); ctx.moveTo(o.x,GROUND); ctx.lineTo(o.x+o.w,GROUND); ctx.lineTo(o.x+o.w/2,y); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(o.x+o.w*.28,y+o.h*.42,o.w*.44,6);
    ctx.fillStyle='#d65f00'; ctx.fillRect(o.x-4,GROUND-6,o.w+8,6);
  } else {
    ctx.fillStyle='#b9782f'; ctx.fillRect(o.x,y,o.w,o.h);
    ctx.strokeStyle='#6d4414'; ctx.lineWidth=3; ctx.strokeRect(o.x+1.5,y+1.5,o.w-3,o.h-3);
    ctx.beginPath(); for(let x=o.x;x<o.x+o.w-20;x+=44){ctx.moveTo(x,y);ctx.lineTo(x+Math.min(44,o.w),y+o.h);} ctx.stroke();
  }
}

function draw(){
  ctx.setTransform(K*DPR,0,0,K*DPR,0,OY*K*DPR);
  const g=ctx.createLinearGradient(0,VT,0,GROUND); g.addColorStop(0,'#8fd0ff'); g.addColorStop(1,'#e6f6ff');
  ctx.fillStyle=g; ctx.fillRect(0,VT,W,GROUND-VT);
  ctx.fillStyle='rgba(255,255,255,.9)';
  st.clouds.forEach(c=>{const r=18*c.s; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.arc(c.x+r,c.y+4,r*.8,0,7); ctx.arc(c.x-r,c.y+5,r*.7,0,7); ctx.fill();});
  // ground
  ctx.fillStyle='#6ab04c'; ctx.fillRect(0,GROUND,W,10);
  ctx.fillStyle='#8a6a43'; ctx.fillRect(0,GROUND+10,W,VB-GROUND);
  ctx.fillStyle='#755a38'; for(let x=-st.off;x<W;x+=40) ctx.fillRect(x,GROUND+28,18,5);
  st.obs.forEach(drawObs);
  // NPC (drawn behind the player)
  if(nbody.complete&&nbody.naturalWidth){
    const n=st.npc, f=n.air?2:(st.started?Math.floor(n.frame):0);
    const nx=NPC_X-NNECK_X*NS, ny=GROUND+n.y-NFOOT*NS;
    dr(nbody,f*NFW,0,NFW,NFH,nx,ny,NFW*NS,NFH*NS);
    const ax=NPC_X+NPC_HEAD_DX*NS, ay=ny+(NNECK_TOP[f]+NPC_CHIN_DROP+NPC_HEAD_DY)*NS;
    if(nheadOK){
      const hh=NPC_HEAD_H*NS, hw=hh*nhead.naturalWidth/nhead.naturalHeight;
      ctx.drawImage(nhead, ax-hw*NPC_CHIN[0], ay-hh*NPC_CHIN[1], hw, hh);
    } else { // placeholder until the head file exists
      const r=NPC_HEAD_H*NS*.4;
      ctx.fillStyle='#f6c9a0'; ctx.strokeStyle='#223'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(ax,ay-r+2,r,0,7); ctx.fill(); ctx.stroke();
    }
  }
  // player
  if(body.naturalWidth&&head.naturalWidth&&head2.naturalWidth){
    const f=st.air?2:(st.started?Math.floor(st.frame):0);
    const x=PX, y=GROUND+st.y-SH+4;
    ctx.imageSmoothingQuality='high';
    dr(body,f*FW,0,FW,FH,x,y,SW,SH);
    const jumping=st.air, img=jumping?head2:head;
    const sc=(jumping?HEAD2_SCALE:HEAD1_SCALE)*S, ch=jumping?HEAD2_CHIN:HEAD1_CHIN;
    const ax=NECK_X+(jumping?HEAD2_DX:HEAD1_DX), ay=NECK_TOP[f]+CHIN_DROP+(jumping?HEAD2_DY:HEAD1_DY);
    ctx.drawImage(img, x+ax*S-ch[0]*sc, y+ay*S-ch[1]*sc, HEADS_W*sc, HEADS_H*sc);
  }
  drawHearts(); drawNpc2();   // NPC 2 (drawn in front, it overtakes everyone)
  // HUD
  ctx.fillStyle='#223'; ctx.font='bold 20px system-ui'; ctx.textAlign='right';
  ctx.fillText('Score '+Math.floor(st.dist/10),W-16,VT+40);
  ctx.font='14px system-ui'; ctx.fillText('Best '+best,W-16,VT+62);
  ctx.textAlign='center';
  if(!st.started&&!st.over){ctx.font='bold 28px system-ui'; ctx.fillText('Tap or press Space to start',W/2,GROUND-150);}
  if(st.over){
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,VT,W,VB-VT);
    ctx.fillStyle='#fff'; ctx.font='bold 40px system-ui'; ctx.fillText('Game over',W/2,GROUND-150);
    ctx.font='20px system-ui'; ctx.fillText('Score '+Math.floor(st.dist/10)+'  ·  Best '+best,W/2,GROUND-112);
    ctx.fillText('Tap or press Space to restart',W/2,GROUND-76);
  }
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts;
  update(dt); draw(); requestAnimationFrame(loop);
}
resize(); addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));
const loaderEl=document.getElementById('loader'), retryBtn=document.getElementById('retry');
function boot(){
  retryBtn.style.display='none';
  loadAll().then(()=>{
    nheadOK=true; reset(); ready=true; last=0;
    loaderEl.classList.add('done'); setTimeout(()=>loaderEl.style.display='none',300);
    requestAnimationFrame(loop);
  }).catch(err=>{
    document.getElementById('lmsg').textContent=err.message+' - check your connection.';
    retryBtn.style.display='block';
  });
}
retryBtn.onclick=()=>{ASSETS.forEach(i=>{i.onload=i.onerror=null; i.removeAttribute('src');}); boot();};
boot();
</script></body></html>
